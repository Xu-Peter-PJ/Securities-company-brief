<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>券商同业对标 · 全期分析仪表板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

/* ===== 顶部标题栏 ===== */
.top-bar {
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.top-bar h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.top-bar .subtitle { font-size: 11px; opacity: 0.55; }

/* ===== 期间 Tab 导航 ===== */
.period-nav {
  display: flex;
  background: #1a1a2e;
  padding: 0 8px;
  overflow-x: auto;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
.period-nav::-webkit-scrollbar { height: 4px; }
.period-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.period-btn {
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
  outline: none;
}
.period-btn:hover { color: #fff; background: rgba(255,255,255,0.04); }
.period-btn.active { color: #fff; border-bottom-color: #4fc3f7; font-weight: 600; }
.period-btn .badge {
  font-size: 9px;
  padding: 1px 7px;
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.45);
}
.period-btn.active .badge { background: #4fc3f7; color: #1a1a2e; font-weight: 600; }

/* ===== 加载提示 ===== */
.loading-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f7fa;
  z-index: 5;
  transition: opacity 0.3s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner { color: #888; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid #e0e0e0;
  border-top-color: #0f3460;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== iframe 容器 ===== */
.iframe-wrap {
  flex: 1;
  position: relative;
  background: #f5f7fa;
}
.iframe-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* ===== 键盘提示 ===== */
.keyboard-hint {
  position: fixed;
  bottom: 12px;
  right: 16px;
  background: rgba(0,0,0,0.7);
  color: rgba(255,255,255,0.7);
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 12px;
  z-index: 200;
  pointer-events: none;
  transition: opacity 0.8s;
}

/* ===== 整体布局 ===== */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
}
</style>
</head>
<body>

<div class="app-shell">

  <!-- 标题栏 -->
  <div class="top-bar">
    <div>
      <h1>🏦 券商同业对标财务分析仪表板</h1>
    </div>
    <span class="subtitle">覆盖 9 家 A 股上市券商 ｜ 2024Q1 — 2026Q1</span>
  </div>

  <!-- 期间导航 -->
  <div class="period-nav" id="periodNav">
    <button class="period-btn active" data-period="2026Q1">
      2026Q1 <span class="badge">一季报</span>
    </button>
    <button class="period-btn" data-period="2025FY">
      2025FY <span class="badge">年报</span>
    </button>
    <button class="period-btn" data-period="2025Q3">
      2025Q3 <span class="badge">三季报</span>
    </button>
    <button class="period-btn" data-period="2025H1">
      2025H1 <span class="badge">半年报</span>
    </button>
    <button class="period-btn" data-period="2025Q1">
      2025Q1 <span class="badge">一季报</span>
    </button>
    <button class="period-btn" data-period="2024FY">
      2024FY <span class="badge">年报</span>
    </button>
    <button class="period-btn" data-period="2024Q3">
      2024Q3 <span class="badge">三季报</span>
    </button>
    <button class="period-btn" data-period="2024H1">
      2024H1 <span class="badge">半年报</span>
    </button>
    <button class="period-btn" data-period="2024Q1">
      2024Q1 <span class="badge">一季报</span>
    </button>
  </div>

  <!-- iframe 内容区 -->
  <div class="iframe-wrap" id="iframeWrap">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span id="loadingText">加载中...</span>
      </div>
    </div>
    <iframe id="contentFrame"
            src="9家券商_2026Q1_分析仪表板.html"
            title="期间分析仪表板"
            sandbox="allow-scripts allow-same-origin"
            loading="lazy">
    </iframe>
  </div>

  <!-- 键盘提示 -->
  <div class="keyboard-hint" id="kbHint">← → 切换期间</div>

</div>

<script>
(function() {
  var PERIODS = ['2026Q1', '2025FY', '2025Q3', '2025H1', '2025Q1', '2024FY', '2024Q3', '2024H1', '2024Q1'];
  var FILE_MAP = {
    '2026Q1': '9家券商_2026Q1_分析仪表板.html',
    '2025FY': '9家券商_2025FY_分析仪表板.html',
    '2025Q3': '9家券商_2025Q3_分析仪表板.html',
    '2025H1': '9家券商_2025H1_分析仪表板.html',
    '2025Q1': '9家券商_2025Q1_分析仪表板.html',
    '2024FY': '9家券商_2024FY_分析仪表板.html',
    '2024Q3': '9家券商_2024Q3_分析仪表板.html',
    '2024H1': '9家券商_2024H1_分析仪表板.html',
    '2024Q1': '9家券商_2024Q1_分析仪表板.html'
  };
  var LABEL_MAP = {
    '2026Q1': '2026年第一季报',
    '2025FY': '2025年年报',
    '2025Q3': '2025年第三季报',
    '2025H1': '2025年半年报',
    '2025Q1': '2025年第一季报',
    '2024FY': '2024年年报',
    '2024Q3': '2024年第三季报',
    '2024H1': '2024年半年报',
    '2024Q1': '2024年第一季报'
  };

  var currentPeriod = '2026Q1';
  var frame = document.getElementById('contentFrame');
  var loading = document.getElementById('loadingOverlay');
  var loadingText = document.getElementById('loadingText');
  var kbHint = document.getElementById('kbHint');

  // 隐藏键盘提示
  var hintTimer;
  function flashHint() {
    kbHint.style.opacity = '1';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function() { kbHint.style.opacity = '0'; }, 2000);
  }

  function switchPeriod(period) {
    if (period === currentPeriod) return;
    currentPeriod = period;

    // 更新按钮状态
    var btns = document.querySelectorAll('.period-btn');
    btns.forEach(function(b) {
      b.classList.toggle('active', b.dataset.period === period);
    });

    // 显示加载
    loading.classList.remove('hidden');
    loadingText.textContent = '正在加载 ' + period + ' ' + LABEL_MAP[period] + '...';

    // 切换 iframe
    frame.src = FILE_MAP[period];

    // 更新页面标题
    document.title = '券商同业对标 · ' + period + ' ' + LABEL_MAP[period];
  }

  // iframe 加载完成后隐藏 loading
  frame.addEventListener('load', function() {
    loading.classList.add('hidden');
  });

  // 点击切换期间
  document.getElementById('periodNav').addEventListener('click', function(e) {
    var btn = e.target.closest('.period-btn');
    if (!btn) return;
    if (btn.classList.contains('active')) return;
    switchPeriod(btn.dataset.period);
    flashHint();
  });

  // 键盘导航
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    var idx = PERIODS.indexOf(currentPeriod);
    if (e.key === 'ArrowRight' && idx > 0) {
      e.preventDefault();
      switchPeriod(PERIODS[idx - 1]);
      flashHint();
    }
    if (e.key === 'ArrowLeft' && idx < PERIODS.length - 1) {
      e.preventDefault();
      switchPeriod(PERIODS[idx + 1]);
      flashHint();
    }
  });

  // 初始加载完成
  frame.addEventListener('load', function onFirstLoad() {
    loading.classList.add('hidden');
    frame.removeEventListener('load', onFirstLoad);
  });

  // 超时回退：5 秒后隐藏 loading（万一 iframe 加载很慢）
  setTimeout(function() {
    loading.classList.add('hidden');
  }, 8000);
})();
</script>

</body>
</html>
